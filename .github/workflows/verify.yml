---

name: Verify
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  ubuntu:
    name: Ubuntu complete verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Shell syntax
        run: for script in install.sh scripts/*.sh; do sh -n "$script"; done
      - run: go test -race ./...
      - run: sh scripts/test-installer.sh
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Cross-build
        run: sh scripts/build-release.sh v0.0.0 "$GITHUB_SHA"
  macos:
    name: macOS runtime verification
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
      - run: go test -race ./...
      - run: sh scripts/test-installer.sh
