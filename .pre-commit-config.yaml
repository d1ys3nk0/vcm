---
repos:
  - repo: local
    hooks:
      - id: gofmt-fix
        name: Format Go
        entry: gofmt -w
        language: system
        types: [go]
        stages: [manual]
      - id: gofmt-check
        name: Check Go formatting
        entry: sh -c 'test -z "$(gofmt -l "$@")"' --
        language: system
        types: [go]
        stages: [pre-commit]
      - id: go-vet
        name: Go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: shell-syntax
        name: Check shell syntax
        entry: sh -c 'for script do sh -n "$script" || exit; done' --
        language: system
        types: [shell]
        stages: [pre-commit]
